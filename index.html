<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generátor QR kódov – offline + farby</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f6f9fc 0%, #e6f0f5 100%);
            padding: 1.5rem;
        }

        .card {
            background: #ffffff;
            max-width: 560px;
            width: 100%;
            padding: 2.5rem 2rem 2rem;
            border-radius: 2rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 30, 0.25),
                0 8px 24px -6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            color: #0b2b3d;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #4b6a7c;
            margin-bottom: 2rem;
            font-weight: 400;
            border-bottom: 2px solid #eef5f9;
            padding-bottom: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #1d3b4d;
            text-align: left;
        }

        .input-group textarea {
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 1rem;
            padding: 0.9rem 1.2rem;
            border: 2px solid #dce8ef;
            border-radius: 1.2rem;
            resize: vertical;
            min-height: 100px;
            max-height: 200px;
            background: #fafdff;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: #0b2b3d;
            line-height: 1.5;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #2a7faa;
            box-shadow: 0 0 0 4px rgba(42, 127, 170, 0.15);
        }

        .input-group textarea::placeholder {
            color: #a0bccd;
        }

        .color-row {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
            margin: 0 0 1.2rem 0;
            flex-wrap: wrap;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1d3b4d;
        }

        .color-item input[type="color"] {
            width: 44px;
            height: 44px;
            padding: 2px;
            border: 2px solid #dce8ef;
            border-radius: 1rem;
            cursor: pointer;
            background: white;
        }

        .color-item input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-item input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.8rem;
        }

        .btn-reset-colors {
            background: transparent;
            border: 1px solid #dce8ef;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #4b6a7c;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-reset-colors:hover {
            background: #eef5f9;
            border-color: #b0ccdc;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .btn {
            font-family: 'Inter', system-ui, sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex: 1 1 auto;
            min-width: 140px;
        }

        .btn-primary {
            background: #1a5f7a;
            color: #fff;
            box-shadow: 0 8px 18px -6px rgba(26, 95, 122, 0.35);
        }

        .btn-primary:hover {
            background: #0f4a62;
            transform: scale(1.02);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #e8f1f7;
            color: #1a5f7a;
        }

        .btn-secondary:hover {
            background: #d4e3ed;
            transform: scale(1.02);
        }

        .btn-secondary:active {
            transform: scale(0.97);
        }

        .btn-download {
            background: #2c8c5e;
            color: #fff;
            box-shadow: 0 8px 18px -6px rgba(44, 140, 94, 0.35);
            display: none;
        }

        .btn-download:hover {
            background: #1f724b;
            transform: scale(1.02);
        }

        .btn-download:active {
            transform: scale(0.97);
        }

        .qr-wrapper {
            background: #fafdff;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 2px dashed #dce8ef;
            transition: border-color 0.3s;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper.has-qr {
            border-color: #2a7faa;
            border-style: solid;
        }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode canvas,
        #qrcode img {
            max-width: 100%;
            height: auto;
            border-radius: 0.75rem;
        }

        .qr-placeholder {
            color: #a0bccd;
            font-size: 0.95rem;
            font-weight: 400;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .qr-placeholder svg {
            opacity: 0.5;
            margin-bottom: 0.25rem;
        }

        .info-msg {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            color: #4b6a7c;
            min-height: 1.5rem;
        }

        .info-msg.error {
            color: #c73b3b;
            font-weight: 500;
        }

        /* ---------- Podpis autora ---------- */
        .signature {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #eef5f9;
            font-size: 0.8rem;
            color: #7a94a3;
            text-align: center;
            line-height: 1.6;
            font-weight: 400;
        }

        .signature strong {
            color: #1d3b4d;
            font-weight: 600;
        }

        .signature a {
            color: #2a7faa;
            text-decoration: none;
            transition: color 0.15s ease;
        }

        .signature a:hover {
            color: #1a5f7a;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .card {
                padding: 1.75rem 1.25rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.65rem 1.5rem;
                min-width: 120px;
                flex: 1 1 100%;
            }
            .actions {
                flex-direction: column;
            }
            .input-group textarea {
                min-height: 80px;
            }
            .color-row {
                gap: 0.75rem;
                justify-content: space-between;
            }
            .color-item {
                font-size: 0.8rem;
            }
            .color-item input[type="color"] {
                width: 38px;
                height: 38px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.25rem 0.75rem;
            }
            #qrcode canvas {
                width: 180px !important;
                height: 180px !important;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎨 Generátor QR</h1>
        <p class="subtitle">Vlož text, zvoľ farby a vytvor QR kód</p>

        <!-- Vstupný text -->
        <div class="input-group">
            <label for="textInput">Text alebo URL</label>
            <textarea id="textInput" placeholder="Napríklad: https://www.example.com alebo ľubovoľný text..." rows="3"></textarea>
        </div>

        <!-- Farbičky -->
        <div class="color-row">
            <div class="color-item">
                <label for="darkColor">Tmavá</label>
                <input type="color" id="darkColor" value="#0b2b3d" />
            </div>
            <div class="color-item">
                <label for="lightColor">Svetlá</label>
                <input type="color" id="lightColor" value="#ffffff" />
            </div>
            <button class="btn-reset-colors" id="resetColorsBtn">↺ Predvolené</button>
        </div>

        <!-- Tlačidlá -->
        <div class="actions">
            <button class="btn btn-primary" id="generateBtn">✨ Generovať</button>
            <button class="btn btn-secondary" id="clearBtn">🗑️ Vymazať</button>
            <button class="btn btn-download" id="downloadBtn">⬇️ Stiahnuť PNG</button>
        </div>

        <!-- QR kód -->
        <div class="qr-wrapper" id="qrWrapper">
            <div id="qrcode">
                <div class="qr-placeholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#b0ccdc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="6" height="6" rx="1" />
                        <rect x="15" y="3" width="6" height="6" rx="1" />
                        <rect x="3" y="15" width="6" height="6" rx="1" />
                        <rect x="15" y="15" width="6" height="6" rx="1" />
                        <line x1="9" y1="6" x2="15" y2="6" />
                        <line x1="6" y1="9" x2="6" y2="15" />
                        <line x1="18" y1="9" x2="18" y2="15" />
                        <line x1="9" y1="18" x2="15" y2="18" />
                    </svg>
                    <span>Tu sa zobrazí QR kód</span>
                </div>
            </div>
            <div class="info-msg" id="infoMsg">&nbsp;</div>
        </div>

        <!-- ---------- Podpis autora ---------- -->
        <div class="signature">
            Vytvoril <strong>Mgr. Patrik Beňovič, PhD.</strong><br />
            <a href="mailto:patrik.benovic@tnuni.sk">patrik.benovic@tnuni.sk</a><br />
            <span>12. 10. 2026</span>
        </div>
    </div>

    <!-- ===== Knižnica QRCode.js ===== -->
    <script src="qrcode.min.js"></script>

    <!-- ===== Aplikačný kód ===== -->
    <script>
        (function() {
            'use strict';

            const textInput = document.getElementById('textInput');
            const darkColorInput = document.getElementById('darkColor');
            const lightColorInput = document.getElementById('lightColor');
            const resetColorsBtn = document.getElementById('resetColorsBtn');
            const generateBtn = document.getElementById('generateBtn');
            const clearBtn = document.getElementById('clearBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const qrContainer = document.getElementById('qrcode');
            const qrWrapper = document.getElementById('qrWrapper');
            const infoMsg = document.getElementById('infoMsg');

            let qrCodeInstance = null;
            let currentText = '';

            function setInfo(text, isError = false) {
                infoMsg.textContent = text;
                infoMsg.className = 'info-msg' + (isError ? ' error' : '');
            }

            function getColors() {
                return {
                    dark: darkColorInput.value,
                    light: lightColorInput.value
                };
            }

            function saveColors(dark, light) {
                try {
                    localStorage.setItem('qr_darkColor', dark);
                    localStorage.setItem('qr_lightColor', light);
                } catch (_) { }
            }

            function loadColors() {
                let dark = localStorage.getItem('qr_darkColor');
                let light = localStorage.getItem('qr_lightColor');
                if (dark) darkColorInput.value = dark;
                if (light) lightColorInput.value = light;
            }

            function setDefaultColors() {
                darkColorInput.value = '#0b2b3d';
                lightColorInput.value = '#ffffff';
                saveColors('#0b2b3d', '#ffffff');
                if (currentText) {
                    generateQR(currentText);
                } else {
                    clearQR();
                }
            }

            function clearQR() {
                qrContainer.innerHTML = `
                    <div class="qr-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#b0ccdc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="6" height="6" rx="1" />
                            <rect x="15" y="3" width="6" height="6" rx="1" />
                            <rect x="3" y="15" width="6" height="6" rx="1" />
                            <rect x="15" y="15" width="6" height="6" rx="1" />
                            <line x1="9" y1="6" x2="15" y2="6" />
                            <line x1="6" y1="9" x2="6" y2="15" />
                            <line x1="18" y1="9" x2="18" y2="15" />
                            <line x1="9" y1="18" x2="15" y2="18" />
                        </svg>
                        <span>Tu sa zobrazí QR kód</span>
                    </div>
                `;
                qrWrapper.classList.remove('has-qr');
                downloadBtn.style.display = 'none';
                setInfo('', false);
                qrCodeInstance = null;
                currentText = '';
            }

            function generateQR(text) {
                const finalText = (text !== undefined) ? text : textInput.value.trim();
                if (finalText === '') {
                    setInfo('⚠️ Prosím, zadajte text alebo URL.', true);
                    textInput.focus();
                    return;
                }

                qrContainer.innerHTML = '';

                const colors = getColors();
                try {
                    qrCodeInstance = new QRCode(qrContainer, {
                        text: finalText,
                        width: 256,
                        height: 256,
                        colorDark: colors.dark,
                        colorLight: colors.light,
                        correctLevel: QRCode.CorrectLevel.H
                    });

                    qrWrapper.classList.add('has-qr');
                    downloadBtn.style.display = 'inline-flex';
                    currentText = finalText;
                    const preview = finalText.length > 40 ? finalText.slice(0, 40) + '…' : finalText;
                    setInfo(`✅ QR kód vygenerovaný pre: "${preview}"`, false);

                    saveColors(colors.dark, colors.light);

                } catch (err) {
                    setInfo('❌ Nepodarilo sa vygenerovať QR kód. Skontrolujte text.', true);
                    console.error(err);
                    clearQR();
                }
            }

            function downloadQR() {
                const canvas = qrContainer.querySelector('canvas');
                if (!canvas) {
                    setInfo('❌ Najprv vygenerujte QR kód.', true);
                    return;
                }

                try {
                    const link = document.createElement('a');
                    link.download = 'qr_kod.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    setInfo('📥 QR kód bol stiahnutý ako PNG.', false);
                } catch (err) {
                    setInfo('❌ Chyba pri sťahovaní obrázka.', true);
                    console.error(err);
                }
            }

            generateBtn.addEventListener('click', function() {
                generateQR();
            });

            clearBtn.addEventListener('click', function() {
                textInput.value = '';
                clearQR();
                setInfo('', false);
            });

            downloadBtn.addEventListener('click', downloadQR);

            darkColorInput.addEventListener('input', function() {
                if (currentText) {
                    generateQR(currentText);
                }
            });
            lightColorInput.addEventListener('input', function() {
                if (currentText) {
                    generateQR(currentText);
                }
            });

            resetColorsBtn.addEventListener('click', setDefaultColors);

            textInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    generateQR();
                }
            });

            textInput.addEventListener('blur', function() {
                if (textInput.value.trim() === '') {
                    setInfo('', false);
                }
            });

            loadColors();

            (function initFromURL() {
                const params = new URLSearchParams(window.location.search);
                const textParam = params.get('text');
                if (textParam) {
                    textInput.value = textParam;
                    generateQR(textParam);
                }
            })();

        })();
    </script>

</body>
</html>
